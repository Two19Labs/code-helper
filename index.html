<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Helper</title>
<style>
  :root { --bg:#f9f9f9; --card:#fff; --ink:#191919; --muted:#666; --line:#e2e2e2; --accent:#257de0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0b; --card:#191919; --ink:#efefef; --muted:#9c9c9c; --line:#303030; --accent:#338ced; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 12px; }
  .row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input { flex:1; min-width:200px; }
  textarea { width:100%; min-height:140px; font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #chat { display:flex; flex-direction:column; gap:10px; margin:12px 0; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { border-left:3px solid var(--muted); }
  .bot { border-left:3px solid var(--accent); }
  .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  small { color:var(--muted); }
  .bot .body { white-space:normal; }
  .bot .body > :first-child { margin-top:0; }
  .bot .body > :last-child { margin-bottom:0; }
  .bot h1, .bot h2, .bot h3 { font-size:16px; margin:14px 0 6px; }
  .bot p { margin:6px 0; }
  .bot ul, .bot ol { margin:6px 0; padding-left:22px; }
  .bot li { margin:3px 0; }
  .bot code { font-family:ui-monospace, Consolas, monospace; font-size:13px; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:1px 4px; }
  .bot pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; }
  .bot pre code { border:0; padding:0; background:none; }
  .bot table { border-collapse:collapse; margin:8px 0; display:block; overflow-x:auto; }
  .bot th, .bot td { border:1px solid var(--line); padding:5px 9px; text-align:left; }
  .bot blockquote { margin:8px 0; padding:4px 12px; border-left:3px solid var(--accent); color:var(--muted); }
  .via { font-size:12px; color:var(--muted); margin-top:8px; }
  .msg { position:relative; }
  .copy { position:absolute; top:8px; right:8px; font-size:12px; padding:3px 10px; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:6px; }
  .copy:hover { color:var(--ink); }
  .bot .who { padding-right:70px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<main>
  <h1>🐍 Python Code Helper</h1>
  <small>Powered by Gemini, with Groq as backup.</small>
  <div id="chat"></div>
  <textarea id="q" placeholder="Paste your code or error, or ask a question… (Ctrl+Enter to send)"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="send">Ask</button>
    <button id="clear" style="background:var(--muted)">Clear chat</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const SYSTEM = `You are a Python code assistant for a student in Delhi University BMS Sem 3, "Introduction to Business Analytics". They run code in Jupyter (VS Code).
Their practicals (all in Python):
P1 data cleaning: read_excel, isnull().sum(), dropna, fillna(median), IQR outliers (Q1-1.5*IQR, Q3+1.5*IQR), drop vs clip (cap).
P2 OLS regression: sm.add_constant, sm.OLS(Y, X).fit(), summary (R², Adj R², p-values, Prob F), model.predict.
P3 assumptions: VIF (variance_inflation_factor, >10 serious), Durbin-Watson (~2 good), Jarque-Bera normality, residual plot, Q-Q plot.
P4 dummy variables: pd.get_dummies(drop_first=True, dtype=int).
P5 logistic: yes/no -> 1/0 with .map, train_test_split(stratify, random_state), sm.Logit, predict probabilities, threshold cut-off, confusion matrix, accuracy/precision/recall/F1, ROC curve, AUC.
P6 decision tree, random forest, K-means (elbow), hierarchical clustering (dendrogram).
Datasets: credit.xlsx (Income, Limit, Rating, Cards, Age, Balance...), boston.xlsx (MEDV + 13 uppercase columns like CRIM, RM, LSTAT), bank.xlsx (age, job, marital, education, default, balance, housing-loan, personal-loan, current-campaign, previous-campaign, subscribed yes/no).
Style they've been taught: import pandas as pd, statsmodels.api as sm; Y first in sm.OLS(Y, X); variable names like credit2, boston1, x_train.
How to answer: give the COMPLETE, runnable code for the whole question in ONE \`\`\`python block (imports at the top, every step, print every result asked for). No teaching, no step-by-step lessons, no questions back.
After the code, add at most 3 short bullets only if the question asks for interpretation (e.g. which variables are significant), in plain words.
If they paste code with an error, return the full corrected code, plus one line per bug saying what was wrong.`;
let history = [];

function add(who, text) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "You" ? "you" : "bot");
  d.innerHTML = '<div class="who"></div><div class="body"></div>';
  d.querySelector(".who").textContent = who;
  d.querySelector(".body").textContent = text;
  $("chat").appendChild(d);
  d.scrollIntoView({ behavior: "smooth" });
  return d.querySelector(".body");
}

// Copies just the code if the answer has code blocks, otherwise the whole answer.
function addCopy(msg, text) {
  const blocks = [...text.matchAll(/```[\w-]*\n([\s\S]*?)```/g)].map(m => m[1].trimEnd());
  const toCopy = blocks.length ? blocks.join("\n\n") : text;
  const b = document.createElement("button");
  b.className = "copy";
  b.textContent = blocks.length ? "Copy code" : "Copy";
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(toCopy); b.textContent = "Copied ✓"; }
    catch { b.textContent = "Failed"; }
    setTimeout(() => b.textContent = blocks.length ? "Copy code" : "Copy", 1500);
  };
  msg.appendChild(b);
}

async function ask() {
  const q = $("q").value.trim();
  if (!q) return;
  add("You", q); $("q").value = "";
  history.push({ role: "user", content: q });
  const out = add("Helper", "Thinking…");
  $("send").disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "system", content: SYSTEM }, ...history] })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error + (data.details ? "\n" + data.details.join("\n") : ""));
    const a = data.reply;
    out.innerHTML = DOMPurify.sanitize(marked.parse(a)) + '<div class="via"></div>';
    out.querySelector(".via").textContent = "— " + data.via;
    addCopy(out.parentElement, a);
    history.push({ role: "assistant", content: a });
  } catch (e) {
    out.textContent = "⚠️ " + e.message;
    history.pop();
  } finally { $("send").disabled = false; }
}

$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) ask(); });
$("clear").onclick = () => { history = []; $("chat").innerHTML = ""; };
</script>
</main>
</body>
</html>
